<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract Smart</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#dde1e7; --text:#1c2430; --muted:#5d6878; --accent:#2f6fb3; --ok:#1f7a5a; --err:#b3261e; --warn:#9a6700; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:10px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:16px; padding:4px 14px; color:var(--muted); cursor:pointer; }
  nav button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .who { margin-left:auto; font-size:13px; color:var(--muted); }
  main { padding:16px 20px; max-width:1500px; margin:auto; }
  .split { display:grid; grid-template-columns:320px minmax(0, 1fr); gap:14px; }
  @media (max-width:900px) { .split { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  .card h2 { font-size:16px; margin:0 0 6px; } .card h3 { font-size:14px; margin:16px 0 8px; }
  .hint { color:var(--muted); font-size:13px; margin:0 0 10px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { background:#f1f3f6; font-weight:600; white-space:nowrap; }
  td input, td select { width:100%; padding:4px 6px; }
  .scroll { overflow-x:auto; }
  .list { display:flex; flex-direction:column; gap:6px; max-height:65vh; overflow:auto; }
  .item { border:1px solid var(--line); border-radius:6px; padding:8px 10px; cursor:pointer; background:#fff; }
  .item:hover { background:#f3f7fc; } .item.sel { border-color:var(--accent); background:#e8f0fa; }
  .item b { display:block; font-size:13px; } .item small { color:var(--muted); font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:10px 14px; align-items:end; }
  label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
  input, select { font:inherit; font-size:13px; padding:6px 8px; border:1px solid #c5ccd6; border-radius:6px; background:#fff; color:var(--text); }
  input:disabled, select:disabled { background:#f3f4f6; color:var(--muted); }
  .checks { display:flex; flex-wrap:wrap; gap:4px 14px; }
  .checks label { flex-direction:row; align-items:center; gap:4px; color:var(--text); font-size:13px; }
  button.btn { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.btn.sec { background:#fff; color:var(--accent); } button.btn.small { padding:2px 8px; font-size:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; background:#eef1f5; }
  .tag.PUBLISHED, .tag.ACTIVE, .tag.CONFIRMED, .tag.APPROVED, .tag.RESOLVED { background:#e3f3ec; color:var(--ok); }
  .tag.DRAFT, .tag.OPEN { background:#fdf3dc; color:var(--warn); } .tag.REJECTED, .tag.CLOSED { background:#fbe7e6; color:var(--err); }
  .vtabs { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px; }
  .vtabs button { font:inherit; font-size:12px; border:1px solid var(--line); background:#fff; border-radius:6px; padding:3px 10px; cursor:pointer; }
  .vtabs button.on { border-color:var(--accent); background:#e8f0fa; }
  .cond .clause { display:flex; gap:4px; align-items:center; margin-bottom:4px; flex-wrap:wrap; }
  .cond .clause select, .cond .clause input { width:auto; min-width:0; }
  .cond .clause .and { font-size:11px; font-weight:600; color:var(--muted); width:28px; }
  .cond .sentence { font-size:12px; color:var(--ok); margin-top:2px; }
  .cond .tools { display:flex; gap:10px; align-items:center; font-size:12px; margin-top:2px; }
  .cond .tools label { flex-direction:row; align-items:center; gap:4px; color:var(--text); font-size:12px; }
  .msg { padding:8px 12px; border-radius:6px; margin:10px 0; font-size:13px; }
  .msg.ok { background:#e3f3ec; color:var(--ok); } .msg.bad { background:#fbe7e6; color:var(--err); }
  .total { font-weight:600; } .approvalLine { margin:4px 0; } .total.ok { color:var(--ok); } .total.bad { color:var(--err); }
  #toast { position:fixed; right:16px; bottom:16px; max-width:460px; z-index:9; }
  .login { max-width:460px; margin:60px auto; }
  .accounts { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; }
  .accounts button { font:inherit; font-size:12px; text-align:left; border:1px solid var(--line); background:#fff; border-radius:6px; padding:6px 8px; cursor:pointer; }
  .accounts button:hover { background:#f3f7fc; }
</style>
</head>
<body>
<header>
  <h1>Contract Smart</h1>
  <nav id="tabs" hidden>
    <button data-tab="lib" class="on">1. Thư viện mốc</button>
    <button data-tab="types">2. Loại hợp đồng</button>
    <button data-tab="contracts">3. Hợp đồng &amp; sự kiện</button>
  </nav>
  <span class="who" id="who"></span>
</header>

<main>
  <!-- Login -->
  <section id="loginPage" class="card login" hidden>
    <h2>Đăng nhập</h2>
    <div class="grid" style="grid-template-columns:1fr">
      <label>Email<input id="lgEmail" value="admin@contract-smart.vn"></label>
      <label>Mật khẩu<input id="lgPass" type="password" value="Passw0rd!"></label>
      <button class="btn" id="lgBtn">Đăng nhập</button>
    </div>
    <div id="lgMsg"></div>
    <p class="hint" style="margin-top:12px">Hoặc bấm một tài khoản demo để vào luôn:</p>
    <div class="accounts" id="accounts"></div>
  </section>

  <!-- 1. Library -->
  <section data-page="lib" hidden>
    <div class="split">
      <div class="card">
        <h2>Thư viện mốc</h2>
        <div class="grid" style="grid-template-columns:1fr">
          <label>Tên mốc mới<input id="libName" placeholder="Ví dụ Giao hàng"></label>
          <label>Chép luật từ (tùy chọn)<select id="libCopy"></select></label>
          <button class="btn small" id="libAdd">+ Thêm mốc</button>
        </div>
        <div class="list" id="libList" style="margin-top:10px"></div>
      </div>
      <div class="card" id="libDetail"><p class="hint">Chọn một mốc bên trái.</p></div>
    </div>
  </section>

  <!-- 2. Contract types -->
  <section data-page="types" hidden>
    <div class="split">
      <div class="card">
        <h2>Loại hợp đồng</h2>
        <div class="row"><input id="typeName" placeholder="Ví dụ Cung cấp hàng hóa" style="flex:1"><button class="btn small" id="typeAdd">+ Thêm</button></div>
        <div class="list" id="typeList" style="margin-top:10px"></div>
      </div>
      <div class="card" id="typeDetail"><p class="hint">Chọn một loại hợp đồng bên trái.</p></div>
    </div>
  </section>

  <!-- 3. Contracts -->
  <section data-page="contracts" hidden>
    <div class="split">
      <div class="card">
        <h2>Hợp đồng</h2>
        <button class="btn small" id="ctNewBtn">+ Tạo hợp đồng</button>
        <div class="list" id="ctList" style="margin-top:10px"></div>
      </div>
      <div class="card" id="ctDetail"><p class="hint">Chọn một hợp đồng bên trái, hoặc tạo mới.</p></div>
    </div>
  </section>
</main>
<div id="toast"></div>

<script src="rule-builder.js"></script>
<script>
const API = "/api/v1";
const $ = (s) => document.querySelector(s);
const tag = (v) => `<span class="tag ${esc(v)}">${esc(v)}</span>`;
const S = { user: null, eventTypes: [], parties: [], selLib: null, selVersion: null, selType: null, selContract: null, selMs: null, backTo: null };

// ---------------- API ----------------
// The token stays in this browser only (development tool); every call sends it.
let TOKEN = null;
try { TOKEN = localStorage.getItem("cs_token"); } catch { /* storage blocked: log in each time */ }
async function api(method, path, body) {
  const res = await fetch(API + path, {
    method, body: body === undefined ? undefined : JSON.stringify(body),
    headers: { ...(body === undefined ? {} : { "content-type": "application/json" }), ...(TOKEN ? { authorization: "Bearer " + TOKEN } : {}) },
  });
  const text = await res.text();
  const json = text ? JSON.parse(text) : null;
  if (res.status === 401 && path !== "/auth/login") { logout(); throw new Error("Phiên đăng nhập hết hạn, đăng nhập lại."); }
  if (!res.ok) throw new Error(json?.message ?? res.statusText);
  return json;
}
const data = async (method, path, body) => (await api(method, path, body))?.data;
function toast(kind, text) {
  $("#toast").innerHTML = `<div class="msg ${kind}" style="box-shadow:0 2px 10px rgba(0,0,0,.15)">${esc(text)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => ($("#toast").innerHTML = ""), kind === "bad" ? 7000 : 3500);
}
/** Runs an action and shows its error instead of failing silently. */
const run = (fn) => async (...args) => { try { await fn(...args); } catch (e) { toast("bad", e.message); } };

// ---------------- Login ----------------
const DEMO = [
  ["admin@contract-smart.vn", "Quản trị hệ thống"], ["auditor@contract-smart.vn", "Kiểm toán (chỉ xem)"],
  ["legal@novaan.vn", "Nova An: pháp lý"], ["owner@novaan.vn", "Nova An: chủ hợp đồng"],
  ["finance@novaan.vn", "Nova An: duyệt tài chính"], ["secondary@novaan.vn", "Nova An: duyệt thứ hai"],
  ["controller@novaan.vn", "Nova An: kiểm soát"], ["supplier@phuminh.vn", "Phú Minh: nhà cung cấp"],
  ["controller@phuminh.vn", "Phú Minh: kiểm soát"],
];
/** One click logs in as a demo account (development data, password from the seed). */
async function loginAs(email, password = "Passw0rd!") {
  const r = await data("POST", "/auth/login", { email, password });
  TOKEN = r.accessToken; try { localStorage.setItem("cs_token", TOKEN); } catch { /* ignore */ }
  await start();
}
$("#accounts").innerHTML = DEMO.map(([e, n]) => `<button data-e="${e}"><b>${esc(n)}</b><br><small>${esc(e)}</small></button>`).join("");
$("#accounts").querySelectorAll("button").forEach((b) => b.onclick = async () => {
  try { await loginAs(b.dataset.e); } catch (e) { $("#lgMsg").innerHTML = `<div class="msg bad">${esc(e.message)}</div>`; }
});
$("#lgBtn").onclick = async () => {
  try { await loginAs($("#lgEmail").value, $("#lgPass").value); }
  catch (e) { $("#lgMsg").innerHTML = `<div class="msg bad">${esc(e.message)}</div>`; }
};
function logout() {
  TOKEN = null; try { localStorage.removeItem("cs_token"); } catch { /* ignore */ }
  $("#tabs").hidden = true; $("#who").innerHTML = ""; document.querySelectorAll("[data-page]").forEach((p) => p.hidden = true);
  $("#loginPage").hidden = false;
}

// ---------------- Tabs ----------------
function showTab(name) {
  S.tab = name;
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x.dataset.tab === name));
  document.querySelectorAll("[data-page]").forEach((s) => s.hidden = s.dataset.page !== name);
  ({ lib: loadLib, types: loadTypes, contracts: loadContracts })[name]();
}
document.querySelectorAll("#tabs button").forEach((b) => b.onclick = run(() => showTab(b.dataset.tab)));

const NEGOTIATORS = ["CONTRACT_OWNER", "LEGAL_REVIEWER"];
const MONEY = {
  none: { label: "Không trả", payableFormula: "0", penaltyFormula: "0" },
  full: { label: "Trả đủ tiền mốc", payableFormula: "planned_payment_vnd_mn", penaltyFormula: "0" },
  late: { label: "Trả sau khi trừ phạt trễ (theo % phạt/ngày, có trần)",
    payableFormula: "MAX(0, planned_payment_vnd_mn - penalty_amount_vnd_mn)",
    penaltyFormula: "MIN(days_late_after_grace * penalty_rate_pct_per_day / 100 * planned_payment_vnd_mn, max_penalty_pct / 100 * planned_payment_vnd_mn)" },
};
/**
 * Ready-made rules: people pick a sentence (and at most one number); the page fills the condition, the
 * decision, the reason and the money. They match the organiser's sample rules word for word, so existing
 * rules show as sentences too. Anything else is a hand-written rule, edited under "Nâng cao".
 */
const TEMPLATES = [
  { key: "dispute", prio: 10, text: "Đang có tranh chấp thì giữ tiền", condition: "open_dispute == TRUE", decision: "HOLD", reasonCode: "OPEN_DISPUTE" },
  { key: "rejection", prio: 20, text: "Bên mua từ chối thì không trả", condition: "valid_rejection_event_count > 0", decision: "REJECT", reasonCode: "REJECTION_PRESENT" },
  { key: "unauthorized", prio: 30, text: "Chứng từ do bên không có quyền ghi thì giữ tiền", condition: "unauthorized_required_event_count > 0", decision: "HOLD", reasonCode: "UNAUTHORIZED_EVENT" },
  { key: "missing", prio: 40, text: "Thiếu chứng từ bắt buộc thì giữ tiền", condition: "required_event_completion_rate < 1.0", decision: "HOLD", reasonCode: "MISSING_REQUIRED_EVENT" },
  { key: "approvals", prio: 50, text: "Mốc cần duyệt mà chưa đủ người duyệt (theo chính sách hợp đồng) thì giữ tiền",
    condition: "approval_required == TRUE AND valid_approval_count < required_approval_quorum", decision: "HOLD", reasonCode: "APPROVAL_QUORUM_NOT_MET" },
  { key: "minApprovals", prio: 52, text: "Chưa đủ {n} người duyệt thì giữ tiền", param: 2, match: /^valid_approval_count < (\d+)$/,
    condition: (n) => `valid_approval_count < ${n}`, decision: "HOLD", reasonCode: "APPROVAL_QUORUM_NOT_MET" },
  { key: "lateReject", prio: 55, text: "Trễ quá {n} ngày (sau ân hạn) thì từ chối", param: 30, match: /^days_late_after_grace > (\d+)$/,
    condition: (n) => `days_late_after_grace > ${n}`, decision: "REJECT", reasonCode: "LATE_COMPLETION" },
  { key: "late", prio: 60, text: "Xong trễ hạn thì trừ tiền phạt (theo % phạt/ngày của hợp đồng, có trần)",
    condition: "late_penalty_applicable == TRUE AND actual_completion_date > due_date + grace_period_days", decision: "PENALTY", reasonCode: "LATE_COMPLETION" },
  { key: "release", prio: 70, text: "Đủ mọi điều kiện thì trả đủ tiền",
    condition: "all_required_conditions_met == TRUE AND open_dispute == FALSE AND valid_rejection_event_count == 0", decision: "RELEASE", reasonCode: "ALL_CONDITIONS_MET" },
  { key: "else", prio: 80, text: "Các trường hợp còn lại thì giữ tiền để kiểm tra", condition: "ELSE", decision: "HOLD", reasonCode: "UNRESOLVED_CONDITION" },
];
/** The template a rule was made from, with its number: { t, n } or null. */
function templateOf(r) {
  for (const t of TEMPLATES) {
    if (t.decision !== r.decision) continue;
    if (t.match) { const m = r.condition.trim().match(t.match); if (m) return { t, n: +m[1] }; }
    else if (squash(t.condition) === squash(r.condition)) return { t, n: null };
  }
  return null;
}
const RESULT_TONE = { RELEASE: "PUBLISHED", PENALTY: "OPEN", HOLD: "DRAFT", REJECT: "REJECTED" };

/** The money a decision normally pays. */
const MONEY_OF = { RELEASE: "full", PENALTY: "late", HOLD: "none", REJECT: "none" };
const squash = (t) => String(t).replace(/\s+/g, "");
/** Rules switched to "custom" on this page keep their formula boxes open even while they still match a preset. */
const customMoney = new Set();
const moneyOf = (r) => customMoney.has(r.id) ? "custom" : Object.keys(MONEY).find((k) => squash(MONEY[k].payableFormula) === squash(r.payableFormula) && squash(MONEY[k].penaltyFormula) === squash(r.penaltyFormula)) ?? "custom";
const RECORDERS = ["SUPPLIER", "LEGAL_REVIEWER", "CONTRACT_OWNER", "FINANCE_APPROVER", "SECONDARY_APPROVER"];
const isAdmin = () => S.user?.role === "SYSTEM_ADMIN";
const negotiatesFor = (c) => NEGOTIATORS.includes(S.user?.role) && S.org === c.buyerId;
const evName = (id) => S.eventTypes.find((t) => t.id === id)?.name ?? `#${id}`;
const partyName = (id) => S.parties.find((p) => p.id === id)?.name ?? `#${id}`;
const money = (v) => Number(v).toLocaleString("vi-VN", { maximumFractionDigits: 2 });

// ================= 1. Milestone library =================
async function loadLib() {
  const list = await data("GET", "/milestone-library?pageSize=100&sortBy=id&order=asc");
  $("#libList").innerHTML = list.map((m) => `<div class="item ${m.id === S.selLib ? "sel" : ""}" data-id="${m.id}"><b>${esc(m.name)}</b><small>id ${m.id}${m.active ? "" : " · đã tắt"}</small></div>`).join("") || `<p class="hint">Chưa có mốc nào.</p>`;
  $("#libList").querySelectorAll(".item").forEach((el) => el.onclick = run(async () => { S.selLib = +el.dataset.id; S.selVersion = null; S.backTo = null; await loadLib(); }));
  $("#libName").closest(".grid").hidden = !isAdmin();
  $("#libCopy").innerHTML = `<option value="">— không, bắt đầu trống —</option>` + list.map((m) => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  if (S.selLib) await renderLib();
}
$("#libAdd").onclick = run(async () => {
  const body = { name: $("#libName").value };
  if ($("#libCopy").value) body.copyFromMilestoneId = +$("#libCopy").value;
  const m = await data("POST", "/milestone-library", body);
  S.selLib = m.id; S.selVersion = m.versions[0].id; $("#libName").value = "";
  toast("ok", `Đã thêm mốc "${m.name}" kèm bản nháp v1.`); await loadLib();
});

async function renderLib() {
  const m = await data("GET", `/milestone-library/${S.selLib}`);
  const custom = S.selVersion && !m.versions.some((v) => v.id === S.selVersion);
  const vid = S.selVersion ?? (m.versions.find((v) => v.status === "DRAFT") ?? m.versions.find((v) => v.status === "PUBLISHED") ?? m.versions.at(-1))?.id;
  const v = vid ? await data("GET", `/milestone-versions/${vid}`) : null;
  const editable = v?.status === "DRAFT" && (custom ? NEGOTIATORS.includes(S.user.role) : isAdmin()), dis = editable ? "" : "disabled";
  const evidence = S.eventTypes.filter((t) => t.category === "EVIDENCE" && t.active);
  $("#libDetail").innerHTML = `
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(m.name)}</h2><span class="hint">milestone_library.id = ${m.id}</span></div>
    <div class="vtabs">${m.versions.map((x) => `<button data-v="${x.id}" class="${x.id === v?.id ? "on" : ""}">v${x.versionNo} ${tag(x.status)}</button>`).join("")}
      ${custom ? `<button class="on">Luật riêng của hợp đồng ${tag(v.status)}</button>` : ""}
      ${isAdmin() && !custom && !m.versions.some((x) => x.status === "DRAFT") ? `<button id="newVer">+ Tạo phiên bản mới để sửa</button>` : ""}</div>
    ${!v ? "" : `
    <p class="hint">${custom ? "Luật riêng của một hợp đồng: bên mua sửa được khi hợp đồng còn DRAFT, khóa khi kích hoạt." : !isAdmin() ? "Chỉ quản trị hệ thống sửa được thư viện mốc; bạn đang xem." : editable ? "Bản nháp: sửa xong thì Công bố." : "Đã công bố / ngừng dùng nên bị khóa. Muốn sửa thì tạo phiên bản mới."}</p>
    <div class="grid">
      <label>Phạt trễ hạn<select id="vPen" ${dis}><option value="false">Không</option><option value="true" ${v.latePenalty ? "selected" : ""}>Có</option></select></label>
      <label style="grid-column:span 2">Ghi chú lần sửa<input id="vNote" value="${esc(v.note ?? "")}" ${dis}></label>
      <label style="grid-column:1/-1">Sự kiện bắt buộc
        <div class="checks">${evidence.map((t) => `<label><input type="checkbox" value="${t.id}" ${v.requiredEventTypeIds.includes(t.id) ? "checked" : ""} ${dis}>${esc(t.name)}</label>`).join("")}</div></label>
    </div>
    <div class="row" style="justify-content:space-between; margin-top:14px"><h3 style="margin:0">Luật (xét từ trên xuống, luật đầu tiên đúng sẽ quyết định)</h3>
      <button class="btn sec small" id="toggleAdv">${S.advanced ? "‹ Xem dạng câu" : "Nâng cao: chỉnh từng điều kiện ›"}</button></div>
    ${S.advanced ? `    <div class="scroll"><table id="rules"><tr><th>Ưu tiên</th><th>Tên luật</th><th>Nếu</th><th>Thì</th><th>Lý do</th><th>Tiền</th>${editable ? "<th></th>" : ""}</tr>
      ${v.rules.map((r) => `<tr data-id="${r.id}"><td style="width:70px"><input data-f="priority" type="number" value="${r.priority}" ${dis}></td>
        <td style="min-width:200px"><input data-f="name" value="${esc(r.name)}" ${dis}></td>
        <td style="min-width:440px">${condEditor(r, dis)}</td>
        <td style="min-width:150px"><select data-f="decision" ${dis}>${["RELEASE", "HOLD", "REJECT", "PENALTY"].map((x) => `<option value="${x}" ${x === r.decision ? "selected" : ""}>${DECISION_VI[x]}</option>`).join("")}</select></td>
        <td style="min-width:170px"><select data-f="reasonCode" ${dis}>${REASONS.map((x) => `<option value="${x[0]}" ${x[0] === r.reasonCode ? "selected" : ""}>${esc(x[1])} → ${esc(x[2])}</option>`).join("")}</select></td>
        <td style="min-width:230px"><select data-money ${dis}>${Object.entries(MONEY).map(([k, x]) => `<option value="${k}" ${moneyOf(r) === k ? "selected" : ""}>${esc(x.label)}</option>`).join("")}
            <option value="custom" ${moneyOf(r) === "custom" ? "selected" : ""}>Công thức khác…</option></select>
          ${moneyOf(r) === "custom" ? `<div style="margin-top:4px"><input data-f="payableFormula" title="Tiền trả" placeholder="Tiền trả" value="${esc(r.payableFormula)}" ${dis}>
            <input data-f="penaltyFormula" title="Tiền phạt" placeholder="Tiền phạt" value="${esc(r.penaltyFormula)}" ${dis} style="margin-top:4px"></div>` : ""}</td>
        ${editable ? `<td><button class="btn sec small" data-rm="${r.id}" data-v="${r.version}">Xóa</button></td>` : ""}</tr>`).join("") || `<tr><td colspan="8" class="hint">Chưa có luật.</td></tr>`}
    </table></div>
` : `
    <div class="scroll"><table id="simple"><tr><th style="width:40px">#</th><th>Luật</th><th style="width:150px">Kết quả</th>${editable ? "<th style=\"width:150px\"></th>" : ""}</tr>
      ${v.rules.map((r, i) => { const tm = templateOf(r);
        const text = tm ? esc(tm.t.text).replace("{n}", editable ? `<input data-param type="number" min="0" style="width:70px" value="${tm.n}">` : String(tm.n))
          : `<i>Luật tự viết:</i> ${esc(sentence(parseCondition(r.condition)))} <span class="hint">(sửa ở Nâng cao)</span>`;
        return `<tr data-id="${r.id}"><td>${i + 1}</td><td>${text}</td><td><span class="tag ${RESULT_TONE[r.decision]}">${esc(DECISION_VI[r.decision])}</span></td>
          ${editable ? `<td style="white-space:nowrap">${i > 0 && r.condition !== "ELSE" ? `<button class="btn sec small" data-up title="Lên trên">↑</button>` : ""}
            ${i < v.rules.length - 1 && v.rules[i + 1].condition !== "ELSE" && r.condition !== "ELSE" ? `<button class="btn sec small" data-down title="Xuống dưới">↓</button>` : ""}
            <button class="btn sec small" data-del>Xóa</button></td>` : ""}</tr>`; }).join("") || `<tr><td colspan="4" class="hint">Chưa có luật. Thêm từ danh sách bên dưới.</td></tr>`}
    </table></div>
    ${editable ? `<div class="row" style="margin-top:8px"><select id="tplPick" style="flex:1">${TEMPLATES
        .filter((t) => !v.rules.some((r) => templateOf(r)?.t.key === t.key))
        .map((t) => `<option value="${t.key}">${esc(t.text.replace("{n}", "…"))}</option>`).join("")}</select>
      <button class="btn small" id="tplAdd">+ Thêm luật này</button></div>` : ""}`}
    <div class="row" style="justify-content:flex-end; margin-top:12px">
      ${S.backTo ? `<button class="btn sec" id="back">‹ Quay lại hợp đồng</button>` : ""}
      ${editable && !custom ? `<button class="btn" id="publish">Công bố v${v.versionNo}</button>` : ""}</div>`}`;

  $("#libDetail").querySelectorAll(".vtabs [data-v]").forEach((b) => b.onclick = run(async () => { S.selVersion = +b.dataset.v; await renderLib(); }));
  if ($("#newVer")) $("#newVer").onclick = run(async () => { const nv = await data("POST", `/milestone-library/${m.id}/versions`); S.selVersion = nv.id; toast("ok", `Đã tạo bản nháp v${nv.versionNo}.`); await renderLib(); });
  if ($("#back")) $("#back").onclick = run(async () => { S.selContract = S.backTo; S.backTo = null; showTab("contracts"); });
  if ($("#toggleAdv")) $("#toggleAdv").onclick = run(async () => { S.advanced = !S.advanced; await renderLib(); });
  if (!v || !editable) return;
  const patchVersion = async (changes) => { await data("PATCH", `/milestone-versions/${v.id}`, { version: v.version, ...changes }); await renderLib(); };
  $("#vPen").onchange = run((e) => patchVersion({ latePenalty: e.target.value === "true" }));
  $("#vNote").onchange = run((e) => patchVersion({ note: e.target.value }));
  $("#libDetail").querySelectorAll(".checks input").forEach((c) => c.onchange = run(() =>
    patchVersion({ requiredEventTypeIds: [...$("#libDetail").querySelectorAll(".checks input:checked")].map((x) => +x.value) })));
  const ruleOf = (el) => v.rules.find((r) => r.id === +el.closest("tr").dataset.id);
  const patchRule = (r, changes) => data("PATCH", `/payment-rules/${r.id}`, { version: r.version, ...changes });
  if (!S.advanced) {
    // Number inside a sentence, e.g. "Trễ quá 30 ngày thì từ chối".
    $("#simple").querySelectorAll("[data-param]").forEach((el) => el.onchange = run(async () => {
      const r = ruleOf(el), tm = templateOf(r);
      await patchRule(r, { condition: tm.t.condition(+el.value), name: tm.t.text.replace("{n}", el.value) }); await renderLib();
    }));
    // Swap the priority of two neighbours (through a free number, priorities are unique per version).
    const swap = async (a, b) => {
      const free = Math.max(...v.rules.map((r) => r.priority)) + 1;
      await patchRule(a, { priority: free });
      await patchRule(b, { priority: a.priority });
      await data("PATCH", `/payment-rules/${a.id}`, { version: a.version + 1, priority: b.priority });
      await renderLib();
    };
    $("#simple").querySelectorAll("[data-up]").forEach((b) => b.onclick = run(() => { const r = ruleOf(b), i = v.rules.indexOf(r); return swap(r, v.rules[i - 1]); }));
    $("#simple").querySelectorAll("[data-down]").forEach((b) => b.onclick = run(() => { const r = ruleOf(b), i = v.rules.indexOf(r); return swap(r, v.rules[i + 1]); }));
    $("#simple").querySelectorAll("[data-del]").forEach((b) => b.onclick = run(async () => { const r = ruleOf(b); await api("DELETE", `/payment-rules/${r.id}?version=${r.version}`); await renderLib(); }));
    // Add a ready-made rule at its usual place, always above the final "còn lại" rule.
    if ($("#tplAdd")) $("#tplAdd").onclick = run(async () => {
      const t = TEMPLATES.find((x) => x.key === $("#tplPick").value);
      if (!t) return;
      const used = new Set(v.rules.map((r) => r.priority));
      const last = v.rules.find((r) => r.condition === "ELSE")?.priority;
      let p = t.prio;
      if (t.key === "else") { if (last) throw new Error("Đã có luật cuối cùng."); p = Math.max(80, ...v.rules.map((r) => r.priority + 10)); }
      else {
        const limit = last ?? Infinity;
        if (used.has(p) || p >= limit) { p = [...Array(Math.min(limit, 1000)).keys()].map((x) => x + 1).find((x) => !used.has(x) && x < limit && x >= 1); }
        if (!p) throw new Error("Không còn chỗ trước luật cuối cùng.");
      }
      const n = t.param, { payableFormula, penaltyFormula } = MONEY[MONEY_OF[t.decision]];
      await data("POST", `/milestone-versions/${v.id}/rules`, {
        priority: p, name: t.text.replace("{n}", n ?? ""), condition: typeof t.condition === "function" ? t.condition(n) : t.condition,
        decision: t.decision, reasonCode: t.reasonCode, payableFormula, penaltyFormula,
      });
      await renderLib();
    });
  }
  if (S.advanced) {
  $("#rules").querySelectorAll("tr[data-id] [data-f]").forEach((el) => el.onchange = run(async () => {
    const r = ruleOf(el), f = el.dataset.f, body = { version: r.version, [f]: f === "priority" ? +el.value : el.value };
    // Changing "Thì" also sets the money it normally pays, unless the rule uses its own formula.
    if (f === "decision" && moneyOf(r) !== "custom") {
      const { payableFormula, penaltyFormula } = MONEY[MONEY_OF[el.value]];
      Object.assign(body, { payableFormula, penaltyFormula });
    }
    await data("PATCH", `/payment-rules/${r.id}`, body); await renderLib();
  }));
  $("#rules").querySelectorAll("[data-money]").forEach((el) => el.onchange = run(async () => {
    const r = ruleOf(el);
    if (el.value === "custom") { customMoney.add(r.id); await renderLib(); return toast("ok", "Sửa công thức trong 2 ô bên dưới (tiền trả, tiền phạt)."); }
    customMoney.delete(r.id);
    const { payableFormula, penaltyFormula } = MONEY[el.value];
    await data("PATCH", `/payment-rules/${r.id}`, { version: r.version, payableFormula, penaltyFormula }); await renderLib();
  }));
  $("#rules").querySelectorAll("[data-c]").forEach((el) => {
    const handler = run(async () => {
      const tr = el.closest("tr"), r = ruleOf(el), k = Number(el.closest(".clause")?.dataset.k);
      let condition;
      if (el.dataset.c === "else" && !el.checked) condition = "open_dispute == TRUE";
      else if (el.dataset.c === "v") { el.closest(".clause").querySelectorAll('[data-c="kind"],[data-c="num"],[data-c="val"]').forEach((x) => x.remove()); condition = readCondition(tr); }
      else condition = readCondition(tr, el.dataset.c, k);
      await data("PATCH", `/payment-rules/${r.id}`, { version: r.version, condition }); await renderLib();
    });
    if (el.tagName === "BUTTON") el.onclick = handler; else el.onchange = handler;
  });
  $("#rules").querySelectorAll("[data-rm]").forEach((b) => b.onclick = run(async () => { await api("DELETE", `/payment-rules/${b.dataset.rm}?version=${b.dataset.v}`); await renderLib(); }));
  // The first rule is the ELSE at priority 80; later rules take the first free slot before the last rule.
  $("#addRule").onclick = run(async () => {
    if (!v.rules.length) {
      await data("POST", `/milestone-versions/${v.id}/rules`, { priority: 80, name: "Còn lại: giữ tiền để kiểm tra", condition: "ELSE", decision: "HOLD", reasonCode: "UNRESOLVED_CONDITION" });
      return renderLib();
    }
    const last = v.rules.at(-1).priority, used = new Set(v.rules.map((r) => r.priority));
    let p = 10; while (used.has(p)) p += 10;
    if (p >= last) throw new Error(`Không còn chỗ trước luật cuối (ưu tiên ${last}); sửa ưu tiên của luật cuối lớn hơn rồi thêm lại.`);
    await data("POST", `/milestone-versions/${v.id}/rules`, { priority: p, name: "Luật mới", condition: "days_late_after_grace > 10", decision: "HOLD", reasonCode: "LATE_COMPLETION" });
    await renderLib();
  });
  }
  if ($("#publish")) $("#publish").onclick = run(async () => { await data("POST", `/milestone-versions/${v.id}/publish`, { version: v.version }); toast("ok", "Đã công bố. Phiên bản cũ (nếu có) chuyển RETIRED."); S.selVersion = null; await loadLib(); });
}

    <div class="row" style="justify-content:space-between"><h2 style="margin:0">#${c.id} ${esc(c.title)} ${tag(c.status)}</h2>

    <div class="scroll"><table id="ms"><tr><th>#</th><th>Mốc</th><th style="width:90px">%</th><th style="width:150px">Hạn</th><th>Tiền (tr)</th><th>Luật</th><th>Cần có</th>${running ? "<th>Kết quả engine</th><th>Chi tiền</th>" : ""}<th></th></tr>
      ${c.milestones.map((m) => `<tr data-id="${m.id}" data-v="${m.version}"><td>${m.position}</td><td>${esc(m.name)}</td>
        <td>${draft ? `<input data-f="paymentPercent" value="${m.paymentPercent}">` : m.paymentPercent}</td>
        <td>${draft ? `<input data-f="dueOn" type="date" value="${m.dueOn}">` : m.dueOn}</td><td>${money(m.amountVndMn)}</td>
        <td>${m.isCustom ? `<b>riêng</b> ${tag(m.versionStatus)}` : `v${m.versionNo} chung`} · ${m.ruleCount} luật</td>
        <td>${esc(m.requiredEventTypeIds.map(evName).join(", "))}<br><small class="hint">+ duyệt: ${esc(POLICY_VI[c.approvalPolicy].roles.map((x) => ROLE_VI[x]).join(" + ") || "không cần")}</small></td>
        ${running ? `<td>${verdict(m.evaluation)}</td><td>${payCell(m, canPay)}</td>` : ""}
        <td style="white-space:nowrap">${draft ? (m.isCustom
          ? `<button class="btn sec small" data-edit="${m.milestoneVersionId}" data-lib="${m.milestoneId}">Sửa luật riêng</button> <button class="btn sec small" data-shared="${m.id}">Về luật chung</button>`
          : `<button class="btn sec small" data-own="${m.id}">Dùng luật riêng</button>`) + ` <button class="btn sec small" data-drop="${m.id}" data-v="${m.version}">Bỏ</button>`
          : running ? `<button class="btn ${S.selMs === m.id ? "" : "sec"} small" data-evs="${m.id}">Sự kiện & cách chấm</button>` : ""}</td></tr>`).join("")}</table></div>
    <p>Tổng tiền: <span class="total ${c.complete ? "ok" : "bad"}">${money(c.totalAmountVndMn)} / ${money(c.valueVndMn)} triệu${c.complete ? " ✓" : " (phải bằng giá trị mới kích hoạt được)"}</span></p>
    ${draft ? `<div class="row"><select id="aLib">${lib.filter((x) => !c.milestones.some((m) => m.milestoneId === x.id)).map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>
      <label style="flex-direction:row;align-items:center;gap:4px">% <input id="aPct" style="width:80px" value="10"></label>
      <label style="flex-direction:row;align-items:center;gap:4px">hạn <input id="aDue" type="date" value="${c.endOn}"></label>
      <button class="btn sec small" id="aAdd">+ Thêm mốc cho riêng hợp đồng này</button></div>` : ""}
    ${running ? `<div id="payPanel"></div>` : ""}
    <div id="evPanel"></div>`;

  const msRow = (el) => el.closest("tr");
  $("#ms").querySelectorAll("tr[data-id] [data-f]").forEach((el) => el.onchange = run(async () => {
    const tr = msRow(el); await data("PATCH", `/milestones/${tr.dataset.id}`, { version: +tr.dataset.v, [el.dataset.f]: el.value }); await renderContract();
  }));
  $("#ms").querySelectorAll("[data-own]").forEach((b) => b.onclick = run(async () => {
    const c2 = await data("POST", `/milestones/${b.dataset.own}/custom-rules`); const m = c2.milestones.find((x) => x.id === +b.dataset.own);
    S.backTo = c.id; S.selLib = m.milestoneId; S.selVersion = m.milestoneVersionId; showTab("lib");
  }));
  $("#ms").querySelectorAll("[data-edit]").forEach((b) => b.onclick = run(async () => { S.backTo = c.id; S.selLib = +b.dataset.lib; S.selVersion = +b.dataset.edit; showTab("lib"); }));
  $("#ms").querySelectorAll("[data-shared]").forEach((b) => b.onclick = run(async () => { await data("DELETE", `/milestones/${b.dataset.shared}/custom-rules`); await renderContract(); }));
  $("#ms").querySelectorAll("[data-drop]").forEach((b) => b.onclick = run(async () => { await api("DELETE", `/milestones/${b.dataset.drop}?version=${b.dataset.v}`); await renderContract(); }));
  $("#ms").querySelectorAll("[data-evs]").forEach((b) => b.onclick = run(async () => { S.selMs = S.selMs === +b.dataset.evs ? null : +b.dataset.evs; await renderContract(); }));
  if ($("#aAdd")) $("#aAdd").onclick = run(async () => { await data("POST", `/contracts/${c.id}/milestones`, { milestoneId: +$("#aLib").value, paymentPercent: $("#aPct").value, dueOn: $("#aDue").value }); await renderContract(); });
  if ($("#activate")) $("#activate").onclick = run(async () => { await data("POST", `/contracts/${c.id}/activate`, { version: c.version }); toast("ok", "Đã kích hoạt: hợp đồng và luật riêng bị khóa."); await loadContracts(); });
  $("#ms").querySelectorAll("[data-pay]").forEach((b) => b.onclick = run(async () => {
    const p = await data("POST", `/payments/${b.dataset.pay}/approve`, { version: +b.dataset.v });
    toast("ok", `Đã duyệt chi ${money(p.amountVndMn)} triệu, cổng thanh toán (mô phỏng) trả mã ${p.gatewayRef}.`); await loadContracts();
  }));
  if (running) await renderPayments(c);
  if (running && S.selMs) await renderEvents(c, c.milestones.find((m) => m.id === S.selMs));
}

const CAT_VI = { EVIDENCE: "Chứng từ", APPROVAL: "Phê duyệt", REJECTION: "Từ chối", DISPUTE_OPEN: "Mở tranh chấp", DISPUTE_RESOLVE: "Đóng tranh chấp", OTHER: "Khác" };
async function renderEvents(c, m) {
  const events = await data("GET", `/milestones/${m.id}/events`);
  const closed = new Set(events.map((e) => e.resolvesEventId).filter(Boolean));
  const open = events.filter((e) => e.eventType.category === "DISPUTE_OPEN" && !closed.has(e.id));
  const types = S.eventTypes.filter((t) => t.active);
  $("#evPanel").innerHTML = `<div class="card" style="margin-top:12px; border-color:var(--accent)">
    <h3 style="margin-top:0">Sự kiện của mốc ${m.position} · ${esc(m.name)} (cần: ${esc(m.requiredEventTypeIds.map(evName).join(", "))})</h3>
    <div class="scroll"><table><tr><th>id</th><th>Loại</th><th>Trạng thái</th><th>Bên</th><th>Lúc</th><th>Số giấy tờ</th><th>Đóng tranh chấp</th><th>Ghi chú</th></tr>
      ${events.map((e) => `<tr><td>${e.id}</td><td>${esc(e.eventType.name)}</td><td>${tag(e.status)}</td><td>${esc(partyName(e.partyId))}</td><td>${esc(e.happenedAt.replace("T", " "))}</td>
        <td>${esc(e.documentNo ?? "")}</td><td>${e.resolvesEventId ? "#" + e.resolvesEventId : ""}</td><td>${esc(e.note)}</td></tr>`).join("") || `<tr><td colspan="8" class="hint">Chưa có sự kiện.</td></tr>`}</table></div>
    ${m.payment?.status === "PAID" ? `<p class="hint">Mốc này <b>đã chi</b>: không ghi thêm sự kiện, engine không chấm lại nữa.</p>`
      : c.status !== "ACTIVE" ? `<p class="hint">Hợp đồng ${esc(c.status)}: không ghi thêm sự kiện.</p>`
      : !RECORDERS.includes(S.user.role) ? `<p class="hint">Vai trò của bạn không ghi sự kiện; bạn đang xem.</p>` : `<h3>Ghi sự kiện mới</h3>
    <div class="grid">
      <label>Loại sự kiện<select id="eType">${Object.keys(CAT_VI).map((cat) => `<optgroup label="${CAT_VI[cat]}">${types.filter((t) => t.category === cat).map((t) =>
        `<option value="${t.id}">${esc(t.name)}${t.actorSide ? (t.actorSide === "BUYER" ? " (bên mua ghi)" : " (nhà cung cấp ghi)") : ""}</option>`).join("")}</optgroup>`).join("")}</select></label>
      <label>Ghi với tư cách<input value="${esc(partyName(S.user.partyId))}" disabled></label>
      <label>Lúc xảy ra (trống = bây giờ)<input id="eAt" type="datetime-local"></label>
      <label>Số giấy tờ<input id="eDoc" placeholder="INV-0451"></label>
      <label id="eResWrap">Đóng tranh chấp nào<select id="eRes"><option value="">— chọn —</option>${open.map((e) => `<option value="${e.id}">#${e.id} ${esc(e.note)}</option>`).join("")}</select></label>
      <label>Ghi chú<input id="eNote"></label>
      <button class="btn" id="eAdd">Ghi sự kiện</button>
    </div><p class="hint">Trạng thái do máy tự điền theo loại sự kiện; bên ghi là bên của chính bạn.</p>`}
    <div id="howPanel"></div></div>`;
  await renderHow(c, m, events);
  if (!$("#eType")) return;
  const side = S.user.partyId === c.supplierId ? "SUPPLIER" : "BUYER";
  const done = new Set(events.map((e) => e.eventTypeId));
  const suggested = m.requiredEventTypeIds.map((id) => S.eventTypes.find((t) => t.id === id))
    .find((t) => t && t.actorSide === side && !done.has(t.id)) ?? m.requiredEventTypeIds.map((id) => S.eventTypes.find((t) => t.id === id)).find((t) => t && t.actorSide === side);
  const approval = S.eventTypes.find((t) => t.category === "APPROVAL" && t.active);
  if (["CONTRACT_OWNER", "FINANCE_APPROVER", "SECONDARY_APPROVER"].includes(S.user.role) && approval) $("#eType").value = approval.id;
  else if (suggested) $("#eType").value = suggested.id;
  const syncRes = () => { $("#eResWrap").hidden = S.eventTypes.find((t) => t.id === +$("#eType").value)?.category !== "DISPUTE_RESOLVE"; };
  $("#eType").onchange = syncRes; syncRes();
  $("#eAdd").onclick = run(async () => {
    const body = { milestoneId: m.id, eventTypeId: +$("#eType").value, note: $("#eNote").value };
    if ($("#eAt").value) body.happenedAt = $("#eAt").value;
    if ($("#eDoc").value) body.documentNo = $("#eDoc").value;
    if (!$("#eResWrap").hidden && $("#eRes").value) body.resolvesEventId = +$("#eRes").value;
    const e = await data("POST", "/events", body);
    const after = (await data("GET", `/milestones/${m.id}/evaluations`)).evaluations[0];
    toast("ok", `Đã ghi sự kiện #${e.id}. Engine chấm lại: ${after ? DECISION_VI[after.decision] + " · " + reasonVi(after.reasonCode) : "chưa chấm được"}.`); await renderContract();
  });
}

// ---------------- Engine results ----------------
const ROLE_VI = { CONTRACT_OWNER: "Chủ hợp đồng", SECONDARY_APPROVER: "Duyệt thứ hai", FINANCE_APPROVER: "Duyệt tài chính" };
/** Approval policies in words: who must approve every milestone (mirrors the API's mapping to the engine). */
const POLICY_VI = {
  SINGLE_BUYER_APPROVAL: { n: 1, roles: ["CONTRACT_OWNER"] },
  DUAL_APPROVAL: { n: 2, roles: ["CONTRACT_OWNER", "SECONDARY_APPROVER"] },
  FINANCE_PLUS_OWNER: { n: 2, roles: ["CONTRACT_OWNER", "FINANCE_APPROVER"] },
  AUTO_IF_ALL_CONDITIONS: { n: 0, roles: [] },
};
const policyText = (k) => { const p = POLICY_VI[k]; return !p ? k : p.n === 0 ? "Tự động: không cần ai duyệt, đủ chứng từ là trả"
  : `${p.n} người: ${p.roles.map((x) => ROLE_VI[x]).join(" + ")}`; };
/** Who approved this milestone and who is still awaited (display only; the count above is the engine's). */
function approvalDetail(c, events) {
  const need = POLICY_VI[c.approvalPolicy]?.roles ?? [];
  if (!need.length) return " · hợp đồng tự động, không cần duyệt";
  const roleOf = (e) => S.parties.find((p) => p.id === e.partyId)?.approvalRole;
  const approvals = events.filter((e) => e.eventType.category === "APPROVAL");
  const done = new Set(approvals.map(roleOf));
  const parts = need.map((x) => done.has(x) ? `${ROLE_VI[x]} ✓` : `<b style="color:var(--warn)">còn chờ ${ROLE_VI[x]}</b>`);
  const extra = [...done].filter((x) => x && !need.includes(x)).map((x) => `${ROLE_VI[x]} đã duyệt nhưng <b>không tính</b> (hợp đồng không yêu cầu vai này)`);
  return " · " + [...parts, ...extra].join(" · ");
}
const reasonVi = (code) => REASONS.find((x) => x[0] === code)?.[1] ?? code;
const STATUS_VI = { PLANNED: "Chưa bắt đầu", IN_PROGRESS: "Đang làm", WAITING_EVIDENCE: "Chờ chứng từ", WAITING_APPROVAL: "Chờ duyệt", ON_HOLD: "Đang giữ",
  REJECTED: "Bị từ chối", ELIGIBLE_FOR_PAYMENT: "Đủ điều kiện trả", PAID_WITH_PENALTY: "Trả có trừ phạt" };
const OUTCOME_VI = { MATCHED: ["✓ khớp → quyết định", "PUBLISHED"], NOT_MATCHED: ["✗ không khớp, xét luật sau", "CLOSED"], NOT_EVALUATED: ["— không cần xét (đã có luật khớp trước)", ""] };
/** Short verdict for the milestone table. */
function verdict(e) {
  if (!e) return `<span class="hint">chưa chấm</span>`;
  const amount = e.decision === "RELEASE" || e.decision === "PENALTY" ? ` ${money(e.payableVndMn)} tr` : "";
  const penalty = Number(e.penaltyVndMn) > 0 ? `, phạt ${money(e.penaltyVndMn)} tr` : "";
  return `<span class="tag ${RESULT_TONE[e.decision]}">${esc(DECISION_VI[e.decision])}${amount}${penalty}</span><br><small class="hint">${esc(reasonVi(e.reasonCode))}</small>`;
}
/** The rule's condition in words, each clause followed by the value the engine computed (display only; the engine decided). */
function explainCondition(text, values) {
  const clauses = parseCondition(text);
  if (clauses === "ELSE") return esc(sentence(clauses));
  return clauses.map((c) => {
    const [x, plus] = c.val.split(/\s*\+\s*/);
    const right = x in values ? ` so với ${showValue(values[x])}${plus && plus in values ? ` + ${showValue(values[plus])} ngày` : ""}` : "";
    return `${esc(sentence([c]).replace(/^Nếu /, ""))} <b>(thực tế: ${showValue(values[c.v])}${right})</b>`;
  }).join(" và ");
}
/** A variable value in words. */
function showValue(v) {
  if (v === true) return "Có"; if (v === false) return "Không"; if (v === null || v === undefined || v === "") return "—";
  return /^-?\d+(\.\d+)?$/.test(String(v)) ? money(v) : esc(v);
}
/** "How was it judged": the numbers, every rule tried in order, the missing / invalid evidence and the history. */
async function renderHow(c, m, events) {
  const { rules, evaluations } = await data("GET", `/milestones/${m.id}/evaluations`);
  const e = evaluations[0], ruleOf = (id) => rules.find((x) => String(x.id) === String(id));
  const box = $("#howPanel");
  if (!e) { box.innerHTML = `<h3>Cách engine chấm</h3><p class="hint">Mốc này chưa được chấm.</p><button class="btn sec small" id="reEval">Chấm lại</button>`; }
  else {
    const f = e.facts, won = ruleOf(e.ruleId);
    const used = new Set(rules.flatMap((x) => VARS.filter((v) => x.condition.includes(v[0])).map((v) => v[0])));
    const vars = VARS.filter((v) => v[0] in f.variables).sort((a, b) => used.has(b[0]) - used.has(a[0]));
    box.innerHTML = `<h3>Cách engine chấm <small class="hint">lần mới nhất ${new Date(e.evaluatedAt).toLocaleString("vi-VN")}${e.triggerEventId ? ` · do sự kiện #${e.triggerEventId}` : " · lúc kích hoạt / bấm chấm lại"}</small></h3>
      <div class="card" style="background:#f7faf8">
        <b>Kết luận:</b> ${verdict(e)} → trạng thái mốc <b>${esc(STATUS_VI[e.milestoneStatus] ?? e.milestoneStatus)}</b>.
        Trả <b>${money(e.payableVndMn)}</b> triệu, phạt <b>${money(e.penaltyVndMn)}</b> triệu (tiền mốc ${money(m.amountVndMn)} triệu).
        ${won ? `<br>Vì luật <b>#${won.priority} "${esc(won.name)}"</b> là luật đầu tiên khớp.` : "<br>Không luật nào khớp."}
      </div>
      <p><b>Bước 1 – Engine đọc sự kiện và tính ra các con số:</b></p>
      <ul class="hint" style="margin-top:0">
        <li>Thiếu sự kiện bắt buộc: ${f.missing.length ? `<b style="color:var(--err)">${esc(f.missing.join(", "))}</b>` : "không thiếu"}</li>
        <li>Sự kiện sai thẩm quyền (bên không được ghi loại đó): ${f.unauthorized.length ? `<b style="color:var(--err)">#${f.unauthorized.join(", #")}</b>` : "không có"}</li>
        <li>Tranh chấp đang mở: ${f.openDisputeIds.length ? `<b style="color:var(--err)">#${f.openDisputeIds.join(", #")}</b>` : "không có"}</li>
        <li>Phê duyệt hợp lệ (engine đếm): <b>${f.validApprovalCount} / ${f.quorum}</b>${approvalDetail(c, events)}</li>
        <li>Hoàn thành lúc: ${f.completedAt ? esc(f.completedAt.replace("T", " ")) : "chưa hoàn thành"} · hạn ${m.dueOn}${f.daysLate ? ` · <b>trễ ${f.daysLate} ngày</b> sau ân hạn` : ""}</li>
        ${f.duplicates.length ? `<li>Sự kiện trùng (bỏ qua): #${f.duplicates.join(", #")}</li>` : ""}
        ${[...f.warnings, ...f.issues].map((w) => `<li>Cảnh báo: ${esc(w)}</li>`).join("")}
      </ul>
      <details><summary class="hint">Xem đủ ${vars.length} con số engine đưa vào luật (in đậm = có luật dùng tới)</summary>
        <div class="scroll"><table><tr><th>Con số</th><th>Giá trị</th></tr>${vars.map((v) => `<tr><td>${used.has(v[0]) ? `<b>${esc(v[1])}</b>` : esc(v[1])}</td><td>${showValue(f.variables[v[0]])}</td></tr>`).join("")}</table></div></details>
      <p><b>Bước 2 – Thử từng luật theo thứ tự, luật đầu tiên khớp quyết định:</b></p>
      <div class="scroll"><table><tr><th>#</th><th>Luật</th><th>Thì</th><th>Kết quả thử</th></tr>
        ${f.trail.map(([id, outcome]) => { const x = ruleOf(id), o = OUTCOME_VI[outcome] ?? [outcome, ""];
          return `<tr ${String(id) === String(e.ruleId) ? 'style="background:#e3f3ec"' : ""}><td>${x?.priority ?? ""}</td><td>${esc(x?.name ?? "luật #" + id)}<br><small class="hint">${x ? explainCondition(x.condition, f.variables) : ""}</small></td>
            <td>${x ? esc(DECISION_VI[x.decision]) : ""}</td><td>${o[1] ? `<span class="tag ${o[1]}">${esc(o[0])}</span>` : `<span class="hint">${esc(o[0])}</span>`}</td></tr>`; }).join("")}</table></div>
      <details style="margin-top:8px"><summary class="hint">Lịch sử chấm (${evaluations.length} lần)</summary>
        <div class="scroll"><table><tr><th>Lúc</th><th>Do</th><th>Kết quả</th><th>Luật</th></tr>
          ${evaluations.map((x) => `<tr><td>${new Date(x.evaluatedAt).toLocaleString("vi-VN")}</td><td>${x.triggerEventId ? "sự kiện #" + x.triggerEventId : "kích hoạt / chấm lại"}</td>
            <td>${verdict(x)}</td><td>${esc(ruleOf(x.ruleId)?.name ?? "")}</td></tr>`).join("")}</table></div></details>
      <p><button class="btn sec small" id="reEval">Chấm lại ngay</button> <span class="hint">Thường không cần: engine tự chấm sau mỗi sự kiện.</span></p>`;
  }
  if (c.status !== "ACTIVE" || m.payment?.status === "PAID") $("#reEval").hidden = true;
  $("#reEval").onclick = run(async () => { await data("POST", `/milestones/${m.id}/evaluate`); toast("ok", "Đã chấm lại."); await renderContract(); });
}

// ---------------- Payments ----------------
const PAY_VI = { PENDING: ["Chờ duyệt chi", "DRAFT"], PAID: ["Đã chi", "PUBLISHED"], CANCELLED: ["Đã hủy", "CLOSED"] };
/** Payment cell of a milestone row: its order, and the approve button for the buyer's finance approver. */
function payCell(m, canPay) {
  const p = m.payment;
  if (!p) return `<span class="hint">${m.evaluation && ["RELEASE", "PENALTY"].includes(m.evaluation.decision) ? "—" : "chưa đủ điều kiện"}</span>`;
  const head = `<span class="tag ${PAY_VI[p.status][1]}">${PAY_VI[p.status][0]}</span> ${money(p.amountVndMn)} tr`;
  if (p.status === "PAID") return `${head}<br><small class="hint">${new Date(p.paidAt).toLocaleString("vi-VN")} · ${esc(p.gatewayRef)}</small>`;
  return canPay ? `${head}<br><button class="btn small" data-pay="${p.id}" data-v="${p.version}">Duyệt chi</button>` : `${head}<br><small class="hint">chờ duyệt tài chính</small>`;
}
/** Every payment order of the contract, including cancelled ones (why they were cancelled). */
async function renderPayments(c) {
  const list = await data("GET", `/payments?contractId=${c.id}&pageSize=100`);
  const name = (id) => c.milestones.find((m) => m.id === id);
  const paid = list.filter((p) => p.status === "PAID").reduce((t, p) => t + Number(p.amountVndMn), 0);
  $("#payPanel").innerHTML = `<details style="margin:8px 0" ${list.length ? "" : ""}><summary><b>Lệnh chi</b> (${list.length}) · đã chi <b>${money(paid)}</b> / ${money(c.valueVndMn)} triệu</summary>
    <p class="hint">Hệ thống tự lập lệnh chi khi engine cho trả. Chỉ <b>duyệt tài chính của bên mua</b> bấm "Duyệt chi" được. Nếu engine chấm lại mà không còn cho trả (ví dụ mở tranh chấp), lệnh chờ bị hủy.</p>
    <div class="scroll"><table><tr><th>Lệnh</th><th>Mốc</th><th>Trạng thái</th><th>Tiền chi</th><th>Phạt đã trừ</th><th>Lần chấm</th><th>Chi lúc / mã giao dịch</th><th>Ghi chú</th></tr>
    ${list.map((p) => `<tr><td>#${p.id}</td><td>${esc(name(p.milestoneId) ? `${name(p.milestoneId).position}. ${name(p.milestoneId).name}` : p.milestoneId)}</td>
      <td><span class="tag ${PAY_VI[p.status][1]}">${PAY_VI[p.status][0]}</span></td><td>${money(p.amountVndMn)}</td><td>${money(p.penaltyVndMn)}</td><td>#${p.evaluationId}</td>
      <td>${p.paidAt ? `${new Date(p.paidAt).toLocaleString("vi-VN")}<br><small>${esc(p.gatewayRef)}</small>` : ""}</td><td>${esc(p.note)}</td></tr>`).join("") || `<tr><td colspan="8" class="hint">Chưa có lệnh chi.</td></tr>`}
    </table></div></details>`;
}

// ---------------- Start ----------------
async function start() {
  if (!TOKEN) return logout();
  try { S.user = await data("GET", "/auth/me"); } catch { return; }
  S.eventTypes = await data("GET", "/event-types?pageSize=100&sortBy=id&order=asc");
  S.parties = await data("GET", "/parties?pageSize=100&sortBy=id&order=asc");
  const own = S.parties.find((p) => p.id === S.user.partyId);
  S.org = own ? (own.type === "APPROVER" ? own.parentId : own.id) : null;
  $("#loginPage").hidden = true; $("#tabs").hidden = false;
  $("#who").innerHTML = `${esc(S.user.fullName)} · ${esc(S.user.role)}${S.user.partyId ? " · " + esc(partyName(S.user.partyId)) : ""}
    · Đổi vai <select id="switchUser" style="font-size:12px;padding:2px 4px">${DEMO.map(([e, n]) => `<option value="${e}" ${e === S.user.email ? "selected" : ""}>${esc(n)}</option>`).join("")}
      ${DEMO.some(([e]) => e === S.user.email) ? "" : `<option selected>${esc(S.user.email)}</option>`}</select>
    · <a href="#" id="logout">Đăng xuất</a>`;
  $("#logout").onclick = (e) => { e.preventDefault(); logout(); };
  $("#switchUser").onchange = run((e) => loginAs(e.target.value));
  showTab(S.tab ?? "lib");
}
start();
</script>
</body>
</html>
